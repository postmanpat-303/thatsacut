[package]
name = "thatsacut"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["postmanpat"]
description = "Blazing fast lossless video trimming and multi-cut tool — Rust rewrite of Pastor Video Trimmer"
license = "MIT"
repository = "https://github.com/postmanpat-303/thatsacut"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
which = "6"

[[bin]]
name = "vc"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Metadata for the .deb package built by cargo-deb in CI
[package.metadata.deb]
maintainer = "postmanpat"
section = "video"
priority = "optional"
depends = "$auto, ffmpeg"
extended-description = """
Blazing fast lossless video trimming and multi-cut tool.
Provides the `vc` command: single trims, multi-range keep/cut,
parallel segment extraction, and optional frame-accurate re-encode.
FFmpeg is required at runtime."""
