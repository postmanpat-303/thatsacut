[package]
name = "thatsacut"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Blazing fast lossless video trimming and multi-cut tool — Rust rewrite of Pastor Video Trimmer"
license = "MIT"
repository = "https://github.com/postmanpat-303/thatsacut"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
which = "6"

[[bin]]
name = "vc"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
